name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    # Dummy values: src/config.ts refuses to load without these secrets.
    # CI never talks to a real auth/session store, so they need not be secret.
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-better-auth-secret-not-for-production-use
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Architecture Boundary Validation
        run: pnpm run validate

      - name: Lint Check
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test

      - name: Build TypeScript
        run: pnpm run build
